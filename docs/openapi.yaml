openapi: 3.1.0
info:
  title: Giraffe RWA Oracle API
  version: 0.3.0
  description: Asset-fact and offline-verification API. External writes remain disabled until the authenticated control-plane gate is explicitly enabled for synthetic testing.
servers: []
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[a-zA-Z0-9._:-]+$' }
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    signedRequest:
      type: apiKey
      in: header
      name: X-Giraffe-Request-Signature
paths:
  /healthz:
    get:
      operationId: health
      responses: { '200': { description: Process health } }
  /readyz:
    get:
      operationId: readiness
      responses: { '200': { description: Runtime safety state } }
  /v1/oracle/statuses:
    get:
      operationId: listOracleStatuses
      responses: { '200': { description: Public status vocabulary } }
  /v1/oracle/deployment-profile:
    get:
      operationId: getPublicDeploymentProfile
      description: Redacted L2 configuration summary; never returns deployment references.
      responses:
        '200': { description: Validated public L2 profile }
        '503': { description: L2 profile is not configured }
  /v1/oracle/protocol-profile:
    get:
      operationId: getProtocolProfile
      description: Version and hash pins for the configured L3 protocol Working Draft.
      responses:
        '200': { description: Pinned L3 protocol profile }
        '503': { description: L3 profile is not configured }
  /v1/rwa/assets/{assetId}:
    get:
      operationId: getAsset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{3,128}$' } }
      responses:
        '200': { description: Minimally disclosed current asset facts }
        '404': { description: Asset not found }
  /v1/rwa/assets/{assetId}/certificate-history:
    get:
      operationId: getCertificateHistory
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{3,128}$' } }
      responses: { '200': { description: Append-only certificate hash history } }
  /v1/rwa/settlements:
    post:
      operationId: beginSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: T+0 intent accepted idempotently }
        '503': { description: External writes disabled }
  /v1/rwa/settlements/{settlementId}:
    get:
      operationId: getSettlement
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{3,128}$' } }
      responses:
        '200': { description: Settlement fact state }
        '404': { description: Settlement not found }
  /v1/rwa/settlements/{settlementId}/finalize:
    post:
      operationId: finalizeSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Settlement finalized after complete authoritative evidence }
        '503': { description: External writes disabled }
  /v1/rwa/settlements/{settlementId}/cancel:
    post:
      operationId: cancelSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Settlement cancelled without changing the holder or certificate }
        '503': { description: External writes disabled }
  /v1/rwa/settlements/{settlementId}/dispute:
    post:
      operationId: disputeSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Settlement disputed and refund notification queued without changing holder or certificate }
        '503': { description: External writes disabled }
  /v1/rwa/settlements/{settlementId}/timeout:
    post:
      operationId: timeoutSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Expired settlement timed out and refund notification queued without changing holder or certificate }
        '503': { description: External writes disabled }
  /v1/rwa/tokens/{chainId}/{contract}/{tokenId}:
    get:
      operationId: getTokenBinding
      parameters:
        - { name: chainId, in: path, required: true, schema: { type: string } }
        - { name: contract, in: path, required: true, schema: { type: string } }
        - { name: tokenId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Token-to-asset binding and current Oracle state }
        '404': { description: Token binding not found }
  /v1/rwa/tokens/{chainId}/{contract}/{tokenId}/certificate-history:
    get:
      operationId: getTokenCertificateHistory
      parameters:
        - { name: chainId, in: path, required: true, schema: { type: string } }
        - { name: contract, in: path, required: true, schema: { type: string } }
        - { name: tokenId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Append-only certificate hash history for the bound asset } }
  /v1/rwa/tokens/{chainId}/{contract}/{tokenId}/transfer-eligibility:
    get:
      operationId: getTokenEligibility
      parameters:
        - { name: chainId, in: path, required: true, schema: { type: string } }
        - { name: contract, in: path, required: true, schema: { type: string } }
        - { name: tokenId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Current transfer eligibility fact } }
  /v1/rwa/attestations/{attestationId}:
    get:
      operationId: getAttestation
      parameters:
        - { name: attestationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Signed attestation and revocation status }
        '404': { description: Attestation not found }
  /v1/rwa/attestations/verify:
    post:
      operationId: verifyAttestation
      description: Computational verification only; does not create or mutate an attestation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation]
              properties:
                attestation: { type: object }
                expectedSubject: { type: object }
      responses:
        '200': { description: Verification result }
        '400': { description: Invalid request }
  /v1/rwa/revocations:
    post:
      operationId: manageRevocation
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Dual-control revocation request or execution accepted }
        '503': { description: External writes disabled }
  /v1/rwa/admin/dashboard:
    get:
      operationId: getAdminOperationalSnapshot
      security: [{ mutualTLS: [], signedRequest: [] }]
      responses:
        '200': { description: Sources, review queue, public signer-set state, audit integrity and outbox backlog }
        '401': { description: Admin authentication required }
        '503': { description: Admin operations not configured }
  /v1/rwa/admin/audit-export:
    get:
      operationId: exportRedactedAudit
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: purpose, in: query, required: true, schema: { type: string, enum: [regulatory-audit, legal-disclosure, internal-reconciliation] } }
      responses:
        '200': { description: Purpose-bound redacted audit records and integrity manifest }
        '403': { description: Audit export permission denied }
  /v1/rwa/admin/actions/approve:
    post:
      operationId: approveHighRiskAdminAction
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Independent approver accepted the exact pending action scope }
        '503': { description: External writes disabled }
  /v1/rwa/admin/sources/disable/request:
    post:
      operationId: requestSourceDisable
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Source-disable action is pending independent approval }
        '503': { description: External writes disabled }
  /v1/rwa/admin/sources/disable/execute:
    post:
      operationId: executeSourceDisable
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Approved source was disabled and appended to audit/outbox }
        '503': { description: External writes disabled }
  /v1/rwa/admin/signers/rotate/request:
    post:
      operationId: requestSignerRotation
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Signer rotation is pending independent approval }
        '503': { description: External writes disabled }
  /v1/rwa/admin/signers/rotate/execute:
    post:
      operationId: executeSignerRotation
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Protected broker proved old rejection, new acceptance, timelock and rollback }
        '503': { description: External writes disabled or protected broker unavailable }
  /v1/rwa/admin/signers/rotate/reconcile:
    post:
      operationId: reconcileAmbiguousSignerRotation
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Protected broker reconciled the exact recovery-required action without replaying rotation }
        '400': { description: Recovery not required, scope mismatch, or reconciliation evidence insufficient }
        '503': { description: External writes disabled or protected reconciler unavailable }
