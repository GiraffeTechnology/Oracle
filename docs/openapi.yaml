openapi: 3.1.0
info:
  title: Giraffe RWA Oracle API
  version: 0.3.0
  description: Asset-fact and offline-verification API. External writes remain disabled until the authenticated control-plane gate is explicitly enabled for synthetic testing.
servers: []
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128, pattern: '^[a-zA-Z0-9._:-]+$' }
  schemas:
    AuthoritativeSettlementFinalizationRequest:
      type: object
      additionalProperties: false
      required: [snapshotHash, evidenceVersion, assetReference, certificateReference, warehouseReference]
      properties:
        snapshotHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        evidenceVersion: { type: integer, minimum: 1 }
        assetReference: { type: string, minLength: 3, maxLength: 256, pattern: '^[a-zA-Z0-9][a-zA-Z0-9:._/-]{2,255}$' }
        certificateReference: { type: string, minLength: 3, maxLength: 256, pattern: '^[a-zA-Z0-9][a-zA-Z0-9:._/-]{2,255}$' }
        warehouseReference: { type: string, minLength: 3, maxLength: 256, pattern: '^[a-zA-Z0-9][a-zA-Z0-9:._/-]{2,255}$' }
    ReceiptDecimal:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
      description: Canonical decimal string, never a JSON number; uint256 IDs and uint64 entry versions/times.
    ReceiptHash:
      type: string
      pattern: "^0x[0-9a-f]{64}$"
    ReceiptAddress:
      type: string
      pattern: "^0x[0-9a-f]{40}$"
    ReceiptBlock:
      type: object
      additionalProperties: false
      required: [number, hash]
      properties:
        number: { $ref: '#/components/schemas/ReceiptDecimal' }
        hash: { $ref: '#/components/schemas/ReceiptHash' }
    ReceiptSnapshot:
      type: object
      additionalProperties: false
      required: [tokenId, source, block, entry, mintPolicyHash, receiptBinding, receiptAvailable, evidence]
      description: Canonical contract-state observation, not original-document authenticity, institutional NFTReceiptAuthority, ZK/state proof, temporal finality or permission to release funds.
      properties:
        tokenId: { $ref: '#/components/schemas/ReceiptDecimal' }
        source:
          type: object
          additionalProperties: false
          required: [chainId, contract, registerId, sourceAuthority]
          properties:
            chainId: { $ref: '#/components/schemas/ReceiptDecimal' }
            contract: { $ref: '#/components/schemas/ReceiptAddress' }
            registerId: { $ref: '#/components/schemas/ReceiptHash' }
            sourceAuthority: { $ref: '#/components/schemas/ReceiptAddress' }
        block: { $ref: '#/components/schemas/ReceiptBlock' }
        entry:
          type: object
          additionalProperties: false
          required: [recordCommitment, previousCommitment, registryReference, holder, version, effectiveAt, supersededAt]
          properties:
            recordCommitment: { $ref: '#/components/schemas/ReceiptHash' }
            previousCommitment: { $ref: '#/components/schemas/ReceiptHash' }
            registryReference: { $ref: '#/components/schemas/ReceiptHash' }
            holder: { $ref: '#/components/schemas/ReceiptAddress' }
            version: { $ref: '#/components/schemas/ReceiptDecimal' }
            effectiveAt: { $ref: '#/components/schemas/ReceiptDecimal' }
            supersededAt: { $ref: '#/components/schemas/ReceiptDecimal' }
        mintPolicyHash: { $ref: '#/components/schemas/ReceiptHash' }
        receiptBinding:
          type: object
          additionalProperties: false
          required: [schemaId, mintPolicyHash, segmentDigest, requestHash, receiptDocumentHash]
          properties:
            schemaId: { $ref: '#/components/schemas/ReceiptHash' }
            mintPolicyHash: { $ref: '#/components/schemas/ReceiptHash' }
            segmentDigest: { $ref: '#/components/schemas/ReceiptHash' }
            requestHash: { $ref: '#/components/schemas/ReceiptHash' }
            receiptDocumentHash: { $ref: '#/components/schemas/ReceiptHash' }
        receiptAvailable: { type: boolean }
        evidence:
          type: object
          additionalProperties: false
          required: [kind, head, minimumConfirmations]
          properties:
            kind: { type: string, const: canonical-contract-state }
            head: { $ref: '#/components/schemas/ReceiptBlock' }
            minimumConfirmations: { type: integer, minimum: 1, maximum: 256 }
    ReceiptReadError:
      type: object
      additionalProperties: false
      required: [ok, errorCode]
      properties:
        ok: { type: boolean, const: false }
        errorCode: { type: string }
  securitySchemes:
    mutualTLS:
      type: mutualTLS
    signedRequest:
      type: apiKey
      in: header
      name: X-Giraffe-Request-Signature
paths:
  /v1/oracle/projection/{tokenId}/receipt/current:
    get:
      operationId: getCurrentReceiptSnapshot
      description: >-
        Latest admitted entry at the selected confirmed block, not necessarily the live tip or holder effective now.
        Source and runtime are fixed by deployment; callers cannot select an upstream.
        All-zero receipt fields return receiptAvailable false, never authority.
        Confirmation depth is separate from temporal finality. Other methods under
        this prefix return405 PROJECTION_READ_ONLY. No automatic submission or retry.
      parameters:
        - { name: tokenId, in: path, required: true, schema: { type: string, pattern: "^(0|[1-9][0-9]*)$", maxLength: 78 }, description: Canonical uint256 decimal string; out-of-range values return400. }
      responses:
        '200':
          description: Confirmed canonical contract snapshot, not institutional or financial acceptance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptSnapshot' }
        '400':
          description: TOKEN_ID_INVALID or VERSION_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '404':
          description: EMPTY_PROJECTION or UNKNOWN_VERSION; not proof of non-execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '405':
          description: PROJECTION_READ_ONLY; no write or document-upload route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '409':
          description: RECEIPT_DOMAIN_MISMATCH, RECEIPT_RUNTIME_IDENTITY_MISMATCH or RECEIPT_SOURCE_REORGED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '502':
          description: RECEIPT_SOURCE_MALFORMED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '503':
          description: Receipt capability, policy, confirmations or provider unavailable; UNKNOWN stays unresolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
  /v1/oracle/projection/{tokenId}/receipt/version/{version}:
    get:
      operationId: getVersionedReceiptSnapshot
      description: >-
        Exact historical version, never a neighboring or cached substitute.
        Source and runtime are fixed by deployment; callers cannot select an upstream.
        All-zero receipt fields return receiptAvailable false, never authority.
        Confirmation depth is separate from temporal finality. Other methods under
        this prefix return405 PROJECTION_READ_ONLY. No automatic submission or retry.
      parameters:
        - { name: tokenId, in: path, required: true, schema: { type: string, pattern: "^(0|[1-9][0-9]*)$", maxLength: 78 }, description: Canonical uint256 decimal string; out-of-range values return400. }
        - { name: version, in: path, required: true, schema: { type: string, pattern: "^[1-9][0-9]*$", maxLength: 20 }, description: Positive canonical uint64 decimal string; zero/out-of-range values return400. }
      responses:
        '200':
          description: Confirmed canonical contract snapshot, not institutional or financial acceptance.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptSnapshot' }
        '400':
          description: TOKEN_ID_INVALID or VERSION_INVALID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '404':
          description: EMPTY_PROJECTION or UNKNOWN_VERSION; not proof of non-execution
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '405':
          description: PROJECTION_READ_ONLY; no write or document-upload route
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '409':
          description: RECEIPT_DOMAIN_MISMATCH, RECEIPT_RUNTIME_IDENTITY_MISMATCH or RECEIPT_SOURCE_REORGED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '502':
          description: RECEIPT_SOURCE_MALFORMED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
        '503':
          description: Receipt capability, policy, confirmations or provider unavailable; UNKNOWN stays unresolved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptReadError' }
  /healthz:
    get:
      operationId: health
      responses: { '200': { description: Process health } }
  /readyz:
    get:
      operationId: readiness
      responses: { '200': { description: Runtime safety state } }
  /v1/oracle/statuses:
    get:
      operationId: listOracleStatuses
      responses: { '200': { description: Public status vocabulary } }
  /v1/oracle/deployment-profile:
    get:
      operationId: getPublicDeploymentProfile
      description: Redacted L2 configuration summary; never returns deployment references.
      responses:
        '200': { description: Validated public L2 profile }
        '503': { description: L2 profile is not configured }
  /v1/oracle/protocol-profile:
    get:
      operationId: getProtocolProfile
      description: Version and hash pins for the configured L3 protocol Working Draft.
      responses:
        '200': { description: Pinned L3 protocol profile }
        '503': { description: L3 profile is not configured }
  /v1/rwa/assets/{assetId}:
    get:
      operationId: getAsset
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{3,128}$' } }
      responses:
        '200': { description: Minimally disclosed current asset facts }
        '404': { description: Asset not found }
  /v1/rwa/assets/{assetId}/certificate-history:
    get:
      operationId: getCertificateHistory
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{3,128}$' } }
      responses: { '200': { description: Append-only certificate hash history } }
  /v1/rwa/settlements:
    post:
      operationId: beginSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: T+0 intent accepted idempotently }
        '503': { description: External writes disabled }
  /v1/rwa/settlements/{settlementId}:
    get:
      operationId: getSettlement
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string, pattern: '^[a-zA-Z0-9_-]{3,128}$' } }
      responses:
        '200': { description: Settlement fact state }
        '404': { description: Settlement not found }
  /v1/rwa/settlements/{settlementId}/finalize:
    post:
      operationId: finalizeSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthoritativeSettlementFinalizationRequest' }
      responses:
        '200': { description: Settlement finalized after complete authoritative evidence }
        '503': { description: External writes disabled }
  /v1/rwa/settlements/{settlementId}/cancel:
    post:
      operationId: cancelSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Settlement cancelled without changing the holder or certificate }
        '503': { description: External writes disabled }
  /v1/rwa/settlements/{settlementId}/dispute:
    post:
      operationId: disputeSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Settlement disputed and refund notification queued without changing holder or certificate }
        '503': { description: External writes disabled }
  /v1/rwa/settlements/{settlementId}/timeout:
    post:
      operationId: timeoutSettlement
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: settlementId, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Expired settlement timed out and refund notification queued without changing holder or certificate }
        '503': { description: External writes disabled }
  /v1/rwa/tokens/{chainId}/{contract}/{tokenId}:
    get:
      operationId: getTokenBinding
      parameters:
        - { name: chainId, in: path, required: true, schema: { type: string } }
        - { name: contract, in: path, required: true, schema: { type: string } }
        - { name: tokenId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Token-to-asset binding and current Oracle state }
        '404': { description: Token binding not found }
  /v1/rwa/tokens/{chainId}/{contract}/{tokenId}/certificate-history:
    get:
      operationId: getTokenCertificateHistory
      parameters:
        - { name: chainId, in: path, required: true, schema: { type: string } }
        - { name: contract, in: path, required: true, schema: { type: string } }
        - { name: tokenId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Append-only certificate hash history for the bound asset } }
  /v1/rwa/tokens/{chainId}/{contract}/{tokenId}/transfer-eligibility:
    get:
      operationId: getTokenEligibility
      parameters:
        - { name: chainId, in: path, required: true, schema: { type: string } }
        - { name: contract, in: path, required: true, schema: { type: string } }
        - { name: tokenId, in: path, required: true, schema: { type: string } }
      responses: { '200': { description: Current transfer eligibility fact } }
  /v1/rwa/attestations/{attestationId}:
    get:
      operationId: getAttestation
      parameters:
        - { name: attestationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Signed attestation and revocation status }
        '404': { description: Attestation not found }
  /v1/rwa/attestations/verify:
    post:
      operationId: verifyAttestation
      description: Computational verification only; does not create or mutate an attestation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attestation]
              properties:
                attestation: { type: object }
                expectedSubject: { type: object }
      responses:
        '200': { description: Verification result }
        '400': { description: Invalid request }
  /v1/rwa/revocations:
    post:
      operationId: manageRevocation
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '200': { description: Dual-control revocation request or execution accepted }
        '503': { description: External writes disabled }
  /v1/rwa/admin/dashboard:
    get:
      operationId: getAdminOperationalSnapshot
      security: [{ mutualTLS: [], signedRequest: [] }]
      responses:
        '200': { description: Sources, review queue, public signer-set state, audit integrity and outbox backlog }
        '401': { description: Admin authentication required }
        '503': { description: Admin operations not configured }
  /v1/rwa/admin/audit-export:
    post:
      operationId: exportRedactedAudit
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose]
              properties:
                purpose: { type: string, enum: [regulatory-audit, legal-disclosure, internal-reconciliation] }
      responses:
        '200': { description: Purpose-bound redacted audit records and integrity manifest }
        '403': { description: Audit export permission denied }
  /v1/rwa/admin/actions/approve:
    post:
      operationId: approveHighRiskAdminAction
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Independent approver accepted the exact pending action scope }
        '503': { description: External writes disabled }
  /v1/rwa/admin/sources/disable/request:
    post:
      operationId: requestSourceDisable
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Source-disable action is pending independent approval }
        '503': { description: External writes disabled }
  /v1/rwa/admin/sources/disable/execute:
    post:
      operationId: executeSourceDisable
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Approved source was disabled and appended to audit/outbox }
        '503': { description: External writes disabled }
  /v1/rwa/admin/signers/rotate/request:
    post:
      operationId: requestSignerRotation
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Signer rotation is pending independent approval }
        '503': { description: External writes disabled }
  /v1/rwa/admin/signers/rotate/execute:
    post:
      operationId: executeSignerRotation
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Protected broker proved old rejection, new acceptance, timelock and rollback }
        '503': { description: External writes disabled or protected broker unavailable }
  /v1/rwa/admin/signers/rotate/reconcile:
    post:
      operationId: reconcileAmbiguousSignerRotation
      security: [{ mutualTLS: [], signedRequest: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Protected broker reconciled the exact recovery-required action without replaying rotation }
        '400': { description: Recovery not required, scope mismatch, or reconciliation evidence insufficient }
        '503': { description: External writes disabled or protected reconciler unavailable }
