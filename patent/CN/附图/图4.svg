<svg xmlns="http://www.w3.org/2000/svg" width="700" height="920" viewBox="0 0 700 920" font-family="WenQuanYi Zen Hei, SimSun, serif" font-size="13">
<defs><marker id="e" markerWidth="10" markerHeight="10" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#000"/></marker></defs>
<rect width="700" height="920" fill="#fff"/>
<g fill="none" stroke="#000" stroke-width="1.6">
  <rect x="130" y="30" width="340" height="56" rx="6"/>
  <rect x="130" y="120" width="340" height="56"/>
  <rect x="130" y="210" width="340" height="56"/>
  <rect x="130" y="300" width="340" height="56"/>
  <rect x="130" y="390" width="340" height="56"/>
  <rect x="130" y="480" width="340" height="56"/>
  <rect x="130" y="570" width="340" height="70"/>
  <rect x="130" y="674" width="340" height="56"/>
  <rect x="130" y="764" width="340" height="56" rx="6"/>
  <rect x="520" y="390" width="150" height="56"/>
</g>
<g fill="#000" text-anchor="middle">
  <text x="300" y="52">S410 开启窗口：校验权限主体、标识、</text><text x="300" y="72">起始快照、截止时刻不超核定期上限</text>
  <text x="300" y="142">S420 前置校验：窗口开启中、未逾期、生效时刻</text><text x="300" y="162">严格递增且不超前向上界、记录承诺未重复</text>
  <text x="300" y="232">S430 计算叶节点摘要：绑定链标识、合约地址、</text><text x="300" y="252">凭证与核定标识、权属人、快照、前后承诺、版本、时刻</text>
  <text x="300" y="322">S440 成员证明：叶标签 0x00 ／ 内节点标签 0x01，</text><text x="300" y="342">逐层归并至根，且索引剩余位全为零</text>
  <text x="300" y="412">S450 终局性：域分隔类型化摘要，</text><text x="300" y="432">不少于门限个互不相同的见证人签名</text>
  <text x="300" y="502">S460 远端高度严格递增，</text><text x="300" y="522">且证明标识未被消费</text>
  <text x="300" y="592">S470 同一个事务内原子写入：消费证明、更新高度、</text><text x="300" y="612">闭合前条区间、追加条目、闭合窗口、发出事件</text>
  <text x="300" y="696">S480 对外提供三项彼此独立的事实：</text><text x="300" y="716">某时刻权属人／是否终局／是否被争议</text>
  <text x="300" y="786">S490 窗口开启期间转移不被阻断，</text><text x="300" y="806">且不由当前所有者推断确认权属人</text>
  <text x="595" y="412">任一校验失败</text><text x="595" y="432">整个事务回滚</text>
</g>
<g fill="none" stroke="#000" stroke-width="1.3" marker-end="url(#e)">
